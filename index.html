<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#4ab6ef"><title>Burger Run Deluxe 🍔</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#70d9f6;font-family:system-ui,-apple-system,Arial,sans-serif;color:white}canvas{display:block;width:100%;height:100%;touch-action:none}button{font-family:inherit;border:0;cursor:pointer;touch-action:manipulation}#hud{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:none;gap:8px;align-items:center;z-index:3}#hud.show{display:flex}.pill{background:#142747b8;border:2px solid #ffffff55;border-radius:16px;padding:9px 10px;font-weight:900;font-size:clamp(12px,3.4vw,17px);box-shadow:0 4px 14px #15345144;white-space:nowrap}#progress{position:fixed;top:calc(env(safe-area-inset-top) + 68px);left:15px;right:15px;height:12px;background:#152c4d99;border:2px solid #fff9;border-radius:20px;overflow:hidden;display:none;z-index:3}#progress.show{display:block}#fill{height:100%;width:0%;background:linear-gradient(90deg,#ffcd48,#ff7c39);border-radius:20px}#pause{margin-left:auto;padding:8px 12px;font-size:22px;border-radius:14px;background:#ffb72e;box-shadow:0 4px #c57a18;color:#3a260b}#overlay{position:fixed;inset:0;z-index:10;background:linear-gradient(180deg,#07355a85,#061d43cc);display:flex;justify-content:center;align-items:center;padding:18px}#overlay.hide{display:none}#panel{width:min(420px,100%);max-height:calc(100dvh - 45px);overflow-y:auto;border:3px solid #fff7;border-radius:30px;background:linear-gradient(160deg,#fff9df,#fff2bb);box-shadow:0 15px 0 #9a561f,0 28px 55px #081c3d80;text-align:center;padding:22px;color:#273552}#logo{font-size:clamp(34px,10vw,52px);line-height:1.05;margin:5px 0 12px;font-weight:1000;color:#ed6c2b;text-shadow:0 3px #fff,0 6px #9a3e18;letter-spacing:-2px}#sub{font-size:16px;line-height:1.5;margin:8px 0 16px;font-weight:650}#buttons{display:grid;gap:11px}.btn{width:100%;padding:14px 16px;border-radius:17px;font-size:18px;font-weight:950;color:#382509;background:#ffbb36;box-shadow:0 5px #c67c17}.btn:active{transform:translateY(3px);box-shadow:0 2px #c67c17}.btn.alt{background:#fff;color:#284066;box-shadow:0 5px #b3c6d8}.btn.dark{background:#4261a1;color:white;box-shadow:0 5px #243c6f}.small{font-size:13px;color:#67738c;margin-top:14px}.setting{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0;font-weight:800}.setting button{padding:10px 13px;border-radius:12px;background:#ffbd43;font-weight:850;color:#273552}#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 15px);left:10px;right:10px;text-align:center;font-size:13px;text-shadow:0 2px 5px #143653;z-index:2;pointer-events:none}#toast{position:fixed;top:29%;left:0;right:0;text-align:center;font-size:28px;font-weight:1000;text-shadow:0 3px 5px #0009;z-index:4;pointer-events:none;opacity:0;transition:opacity .2s}
</style></head><body><canvas id="game"></canvas><div id="hud"><span id="burger" class="pill">🍔 0</span><span id="power" class="pill">💪 Level 1</span><span id="meters" class="pill">🏁 0m</span><button id="pause" aria-label="Pauze">⏸</button></div><div id="progress"><div id="fill"></div></div><div id="hint">👈 Veeg links/rechts • Veeg omhoog om te springen</div><div id="toast"></div><div id="overlay"><div id="panel"><div id="logo">🍔 BURGER<br>RUN!</div><p id="sub">Pak hamburgers, groei en beuk door de muren!</p><div id="buttons"></div><div class="small">Burger Run Deluxe • mobiele prototypeversie</div></div></div><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const get=(k,d)=>{try{return localStorage.getItem(k)??d}catch{return d}},put=(k,v)=>{try{localStorage.setItem(k,String(v))}catch{}};let sound=get('br_sound','yes')==='yes',character=get('br_character','man'),best=Number(get('br_best','0'))||0;let state='menu',lane=1,displayLane=1,burgers=0,dist=0,items=[],nextSpawn=24,jump=0,jumpV=0,life=2,particles=[],last=0,elapsed=0,toastTimer=0,hitFlash=0,ambient=0;const FINISH=850;const R=()=>Math.random(),rnd=(a,b)=>a+(b-a)*R(),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const level=()=>Math.min(12,1+Math.floor(burgers/2));let audio;function beep(freq=550,duration=.08,type='sine'){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function menu(title,description,buttons){$('logo').innerHTML=title;$('sub').innerHTML=description;$('buttons').replaceChildren();for(const [label,fn,style] of buttons){const b=document.createElement('button');b.className='btn '+(style||'');b.textContent=label;b.onclick=fn;$('buttons').append(b)}$('overlay').classList.remove('hide');$('hud').classList.remove('show');$('progress').classList.remove('show');$('hint').style.display='none'}function home(){state='menu';menu('🍔 BURGER<br>RUN!','Ren door de stad, verzamel burgers en word groot genoeg om muren te slopen!',[['▶ START GAME',start],['⚙️ SETTINGS',settings,'alt'],['🏆 HIGHSCORE',scores,'alt'],['❓ HOW TO PLAY',help,'alt']])}function settings(){state='settings';menu('⚙️ SETTINGS','Pas je game aan.',[['🔊 Geluid: '+(sound?'AAN':'UIT'),()=>{sound=!sound;put('br_sound',sound?'yes':'no');beep();settings()},'alt'],['🧍 Personage: '+(character==='man'?'Mannetje':'Vrouwtje'),()=>{character=character==='man'?'vrouw':'man';put('br_character',character);settings()},'alt'],['← TERUG',home,'dark']])}function scores(){state='scores';menu('🏆 HIGHSCORE',`Beste afstand: <b>${best} meter</b><br>Haal jij de finish op ${FINISH} meter?`,[['← TERUG',home,'dark']])}function help(){state='help';menu('🎮 SPELUITLEG','👈 Veeg links of rechts om van baan te wisselen.<br>⬆️ Veeg omhoog om te springen.<br>🍔 Elke 2 hamburgers groei je één level.<br>🧱 Breek muren alleen als je groot genoeg bent.<br>❤️ Je hebt 2 levens. Bereik de finish!',[['▶ SPELEN',start],['← TERUG',home,'dark']])}function pause(){if(state!=='play')return;state='pause';menu('⏸ PAUZE',`🍔 ${burgers} burgers · 💪 Level ${level()} · ❤️ ${life}`,[['▶ VERDER',resume],['🔄 OPNIEUW',start,'alt'],['🏠 HOOFDMENU',home,'dark']])}function resume(){state='play';$('overlay').classList.add('hide');$('hud').classList.add('show');$('progress').classList.add('show');$('hint').style.display='block';last=performance.now()}$('pause').onclick=pause;
function start(){lane=1;displayLane=1;burgers=0;dist=0;life=2;items=[];particles=[];nextSpawn=20;jump=0;jumpV=0;elapsed=0;hitFlash=0;state='play';resume();updateHud();beep(450,.13)}function updateHud(){$('burger').textContent='🍔 '+burgers;$('power').textContent='💪 Lv '+level()+' ❤️'+life;$('meters').textContent='🏁 '+Math.floor(dist)+'m';$('fill').style.width=(dist/FINISH*100)+'%'}function say(s){$('toast').textContent=s;$('toast').style.opacity='1';toastTimer=1.15}function finish(win){state='end';put('br_best',Math.max(best,Math.floor(dist)));best=Math.max(best,Math.floor(dist));beep(win?880:160,.22);menu(win?'🏆 GEWONNEN!':'💥 GAME OVER',win?`Fantastisch! Je hebt de finish gehaald!<br>🍔 ${burgers} burgers · 💪 Level ${level()}`:`Je kwam tot <b>${Math.floor(dist)} meter</b>.<br>🍔 ${burgers} burgers · 💪 Level ${level()}<br>Probeer een andere baan of spring!`,[['🔄 NOG EEN KEER',start],['🏠 HOOFDMENU',home,'dark']])}
function move(dir){if(state==='play'){lane=clamp(lane+dir,0,2);beep(240,.035)}}function leap(){if(state==='play'&&jump===0){jumpV=10.5;beep(370,.08)}}let tx=0,ty=0;canvas.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>26&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy< -25)leap()},{passive:true});addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w','Escape'].includes(e.key))e.preventDefault();if(e.key==='Escape')state==='play'?pause():state==='pause'?resume():null;if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')leap()});
function spawn(){let laneNum=Math.floor(R()*3),type=R()<.72?'burger':R()<.55?'crate':'wall';let required=clamp(level()+Math.floor(rnd(-1,3)),2,10);if(dist<80)type='burger';items.push({z:125,lane:laneNum,type,required,done:false,phase:rnd(0,6)});if(R()<.58){const other=(laneNum+1+Math.floor(R()*2))%3;items.push({z:125,lane:other,type:'burger',done:false,phase:rnd(0,6)})}nextSpawn+=rnd(18,28)}function hit(it){it.done=true;if(it.type==='burger'){burgers++;beep(570+burgers%4*100,.09);if(burgers%2===0){say('💪 LEVEL '+level()+'!');beep(870,.17)}else say('+1 🍔');for(let i=0;i<9;i++)particles.push({x:W/2,y:H*.72,vx:rnd(-95,95),vy:rnd(-140,-40),life:.6})}else if(it.type==='wall'&&level()>=it.required){say('💥 MUUR GESLOOPT!');beep(110,.14,'sawtooth');for(let i=0;i<12;i++)particles.push({x:W/2,y:H*.65,vx:rnd(-130,130),vy:rnd(-130,50),life:.7})}else if(it.type==='crate'&&jump>.85){say('✨ MOOIE SPRONG!')}else{life--;hitFlash=.5;beep(110,.24,'square');say('💔 AU!');if(life<=0){finish(false);return}}updateHud()}
function update(dt){elapsed+=dt;ambient+=dt;displayLane+=(lane-displayLane)*Math.min(1,dt*13);jump=Math.max(0,jump+jumpV*dt);if(jump>0){jumpV-=27*dt;if(jump===0)jumpV=0}if(jump<.02&&jumpV<0){jump=0;jumpV=0}const speed=19+Math.min(14,dist/95);dist+=speed*dt;while(dist>=nextSpawn)spawn();for(const it of items){it.z-=speed*dt;if(!it.done&&it.z<6&&it.z>-2&&it.lane===lane)hit(it)}items=items.filter(it=>it.z>-8&&!it.done);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=190*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').style.opacity='0'}hitFlash=Math.max(0,hitFlash-dt);updateHud();if(dist>=FINISH)finish(true)}
function rect(x,y,w,h,color,r=0){ctx.fillStyle=color;ctx.beginPath();if(r)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill()}function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fill()}function line(x,y,x2,y2,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fill()}function proj(z,l){let t=clamp(1-z/145,0,1),s=Math.pow(t,1.55);return{x:W/2+(l-1)*W*(.045+.26*s),y:H*.36+s*H*.58,s:.13+s*1.3}}
function background(){let sky=ctx.createLinearGradient(0,0,0,H*.75);sky.addColorStop(0,'#48b5f5');sky.addColorStop(1,'#d5f7ff');rect(0,0,W,H,sky);ellipse(W*.8,H*.15,35,35,'#fff3a5');for(let i=0;i<6;i++){let x=((i*173+ambient*10)%(W+190))-95,y=H*(.12+(i%3)*.065);ellipse(x,y,35,13,'#ffffffb8');ellipse(x+20,y-8,23,16,'#ffffffb8')}for(let i=0;i<13;i++){let x=i*W/9-20,y=H*.36-(i%4)*H*.06;rect(x,y,W/12,H*.36-y,'#75b3bb');for(let j=0;j<3;j++)rect(x+7+j*13,y+15,5,9,'#cde8c8')}rect(0,H*.37,W,H*.63,'#74d266');poly([[W*.44,H*.36],[W*.56,H*.36],[W*1.13,H],[W*-.13,H]],'#4a5062');poly([[W*.455,H*.36],[W*.545,H*.36],[W*1.03,H],[W*-.03,H]],'#606b7a');for(let l=0;l<2;l++){for(let z=5;z<145;z+=20){let z2=z+9,p=proj(z,l+.5),q=proj(z2,l+.5);line(p.x,p.y,q.x,q.y,'#fff3ce',Math.max(2,p.s*5))}}for(let i=0;i<8;i++){let z=(i*25+ambient*17)%160,p=proj(z,-.9);ellipse(p.x,p.y,7*p.s,3*p.s,'#367c4b');rect(p.x-3*p.s,p.y-32*p.s,6*p.s,30*p.s,'#916039');ellipse(p.x,p.y-40*p.s,19*p.s,24*p.s,'#1da65a');let q=proj(z,2.9);rect(q.x-3*q.s,q.y-32*q.s,6*q.s,30*q.s,'#916039');ellipse(q.x,q.y-40*q.s,19*q.s,24*q.s,'#1da65a')}}
function burgerShape(x,y,s){ellipse(x,y+10*s,20*s,5*s,'#793916');rect(x-21*s,y+2*s,42*s,7*s,'#efaa45',4*s);rect(x-20*s,y-4*s,40*s,6*s,'#6a3520',3*s);rect(x-22*s,y-7*s,44*s,5*s,'#54b93e',3*s);ellipse(x,y-9*s,22*s,13*s,'#efb659');for(let i=-2;i<=2;i++)ellipse(x+i*7*s,y-14*s+(i%2)*2*s,1.6*s,1*s,'#fff5c4')}
function drawItem(it){let p=proj(it.z,it.lane),s=p.s;if(s<=.15)return;let y=p.y-26*s+Math.sin(ambient*5+it.phase)*3*s;ellipse(p.x,p.y,19*s,5*s,'#0004');if(it.type==='burger'){burgerShape(p.x,y,s*.85)}else if(it.type==='crate'){rect(p.x-22*s,y-24*s,44*s,40*s,'#bd7734',5*s);rect(p.x-16*s,y-18*s,32*s,28*s,'#e2a24e',2*s);line(p.x-15*s,y-16*s,p.x+15*s,y+8*s,'#a2632e',4*s);line(p.x+15*s,y-16*s,p.x-15*s,y+8*s,'#a2632e',4*s)}else{rect(p.x-29*s,y-42*s,58*s,55*s,'#8e8b9e',4*s);for(let j=0;j<3;j++)line(p.x-27*s,y-27*s+j*17*s,p.x+27*s,y-27*s+j*17*s,'#d3cfdb',3*s);rect(p.x-22*s,y-34*s,44*s,19*s,'#fbe2a2',3*s);ctx.fillStyle='#72351a';ctx.font=`900 ${Math.max(8,16*s)}px system-ui`;ctx.textAlign='center';ctx.fillText('LV '+it.required,p.x,y-19*s)}}
function player(){let p=proj(0,displayLane),x=p.x,y=H*.865-jump*H*.12;const grow=1+(level()-1)*.075,sw=clamp(grow,1,1.85),bob=jump>0?0:Math.sin(ambient*14)*3;ellipse(x,y+24,29*sw,8,'#0005');ctx.save();ctx.translate(x,y+bob);let run=Math.sin(ambient*15);line(-9,-12, -12+run*8,18,'#1f3454',8);line(9,-12, 12-run*8,18,'#1f3454',8);ellipse(-12+run*8,19,10,5,'#fefefe');ellipse(12-run*8,19,10,5,'#fefefe');ellipse(0,-36,22*sw,31,'#f75f37');ellipse(0,-39,15*sw,18,'#ffb343');line(-18*sw,-52,-24*sw-run*7,-23,'#f0a679',8);line(18*sw,-52,24*sw+run*7,-23,'#f0a679',8);ellipse(0,-84,19,22,'#f1ae82');ellipse(-7,-86,2,3,'#25344c');ellipse(7,-86,2,3,'#25344c');line(-5,-75,5,-75,'#b34b4d',2);ellipse(0,-101,20,10,character==='man'?'#46302b':'#813e45');if(character==='vrouw'){ellipse(-20,-84,6,22,'#813e45');ellipse(20,-84,6,22,'#813e45')}else rect(-22,-103,44,6,'#ffcd39',4);ctx.restore()}
function draw(){background();items.sort((a,b)=>b.z-a.z);for(const it of items)drawItem(it);player();for(const p of particles)rect(p.x,p.y,7,7,'#ffe04b',2);if(hitFlash>0)rect(0,0,W,H,`rgba(255,55,55,${hitFlash*.45})`);if(state==='menu'||state==='settings'||state==='scores'||state==='help'){} }
function frame(t){const dt=Math.min(.04,Math.max(0,(t-last)/1000||0));last=t;if(state==='play')update(dt);else ambient+=dt*.35;draw();requestAnimationFrame(frame)}home();requestAnimationFrame(frame);
</script></body></html>
