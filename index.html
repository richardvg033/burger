<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Burger Run 🍔</title><style>*{box-sizing:border-box}body{margin:0;background:#10182d;color:white;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 5px #000;font-size:18px;pointer-events:none}#tip{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-size:13px;text-shadow:0 2px 5px #000;pointer-events:none}#overlay{position:absolute;inset:0;background:#091426b8;display:flex;align-items:center;justify-content:center;padding:22px}#panel{background:#fff;color:#16213a;border-radius:24px;padding:26px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px #0008}h1{font-size:34px;margin:0 0 8px}p{line-height:1.5}button{border:0;background:#ffae20;color:#24170a;font-weight:900;font-size:19px;border-radius:15px;padding:15px 28px;cursor:pointer;box-shadow:0 5px 0 #d27a00}button:active{transform:translateY(3px);box-shadow:0 2px 0 #d27a00}.hidden{display:none!important}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="burgers">🍔 0</span><span id="size">💪 Level 1</span><span id="distance">🏁 0/600</span></div><div id="tip">👈 Veeg links/rechts om van baan te wisselen • ↑ om te springen</div><div id="overlay"><div id="panel"><h1 id="heading">🍔 Burger Run</h1><p id="message">Pak hamburgers en groei! Elke <b>2 burgers</b> word je dikker. Breek door muren als je groot genoeg bent. Bereik de finish!<br><br>📱 Veeg links/rechts en omhoog.<br>⌨️ Pijltjes of A/D en spatie.</p><button id="start">START SPEL ▶</button></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const ui={overlay:document.getElementById('overlay'),heading:document.getElementById('heading'),message:document.getElementById('message'),start:document.getElementById('start'),burgers:document.getElementById('burgers'),size:document.getElementById('size'),distance:document.getElementById('distance')};let running=false,ended=false,lane=1,burgers=0,dist=0,jump=0,jumpV=0,items=[],spawnAt=0,last=0,shake=0;const FINISH=600;function rand(a,b){return a+Math.random()*(b-a)};function reset(){running=true;ended=false;lane=1;burgers=0;dist=0;jump=0;jumpV=0;items=[];spawnAt=15;last=performance.now();ui.overlay.classList.add('hidden');requestAnimationFrame(frame)}function end(win){running=false;ended=true;ui.heading.textContent=win?'🏆 Gewonnen!':'💥 Game over!';ui.message.innerHTML=win?`Je hebt de finish gehaald met <b>${burgers} hamburgers</b>!<br>Je groeide naar level ${Math.min(9,1+Math.floor(burgers/2))}.`:`Je botste tegen een obstakel!<br>Je verzamelde <b>${burgers} hamburgers</b>.<br><br>Tip: wissel van baan of spring over lage obstakels.`;ui.start.textContent='OPNIEUW SPELEN 🔄';ui.overlay.classList.remove('hidden')};ui.start.onclick=reset;ui.start.addEventListener("touchend",function(e){e.preventDefault();reset()},{passive:false});
function move(n){if(running)lane=Math.max(0,Math.min(2,lane+n))}function leap(){if(running&&jump===0)jumpV=11}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key===' '||e.key==='w')leap()});let tx=0,ty=0;canvas.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy< -25)leap()},{passive:true});
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.rect(x,y,w,h);ctx.fill()}function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fill()}function project(z,l){const depth=Math.max(.02,Math.min(1,1-z/100)),p=Math.pow(depth,1.45);return {x:W/2+(l-1)*W*.27*p,y:H*.31+H*.58*p,s:.15+1.15*p,p}}function spawn(){let row=spawnAt;const safe=Math.floor(rand(0,3));for(let l=0;l<3;l++){if(l===safe){items.push({z:row,l,type:'burger',hit:false});items.push({z:row+4,l,type:'burger',hit:false})}else if(Math.random()<.48){items.push({z:row+2,l,type:'wall',hit:false,need:Math.floor(rand(2,6))})}else{items.push({z:row,l,type:'burger',hit:false})}}spawnAt+=rand(19,26)}function frame(t){if(!running)return;let dt=Math.min(.04,(t-last)/1000);last=t;dist+=dt*13.5;if(dist>=FINISH){end(true);return}if(jump>0||jumpV>0){jump+=jumpV*dt;jumpV-=27*dt;if(jump<=0){jump=0;jumpV=0}}while(spawnAt<dist+100)spawn();for(let it of items){if(!it.hit&&it.z<=dist+2&&it.z>=dist-1&&it.l===lane){it.hit=true;if(it.type==='burger'){burgers++;shake=5}else if(jump<1.05&&Math.floor(burgers/2)+1<it.need){end(false);return}else if(it.type==='wall')shake=14}}items=items.filter(it=>it.z>dist-4);shake*=.86;draw(t);ui.burgers.textContent='🍔 '+burgers;ui.size.textContent='💪 Level '+Math.min(9,1+Math.floor(burgers/2));ui.distance.textContent='🏁 '+Math.floor(dist)+'/'+FINISH;requestAnimationFrame(frame)}
function draw(t){const horizon=H*.31;let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#5abafc');sky.addColorStop(1,'#c8efff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ellipse(W*.82,H*.12,35,35,'#ffdf5c');for(let i=0;i<7;i++){let x=(i*191+35)% (W+150)-75;ellipse(x,horizon-25-(i%3)*23,48,14,'#ffffff99')}ctx.fillStyle='#74ca61';ctx.fillRect(0,horizon,W,H-horizon);ctx.fillStyle='#505968';ctx.beginPath();ctx.moveTo(W*.46,horizon);ctx.lineTo(W*.54,horizon);ctx.lineTo(W*1.2,H);ctx.lineTo(-W*.2,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffffffaa';ctx.lineWidth=3;for(let l of [0,1,2,3]){let x0=W/2+(l-1.5)*W*.027;let x1=W/2+(l-1.5)*W*.27;ctx.beginPath();ctx.moveTo(x0,horizon);ctx.lineTo(x1,H);ctx.stroke()}for(let z=Math.floor(dist/8)*8+8;z<dist+100;z+=8){let p=project(z-dist,1);ctx.fillStyle='#ffffff80';ctx.fillRect(W/2-2*p.s,p.y,4*p.s,10*p.s)}for(let it of [...items].sort((a,b)=>b.z-a.z)){let dz=it.z-dist;if(dz<0||dz>100||it.hit)continue;let p=project(dz,it.l),s=p.s;ctx.save();ctx.translate(p.x,p.y);if(it.type==='burger'){ellipse(0,-29*s,23*s,10*s,'#f9ad39');rounded(-21*s,-29*s,42*s,8*s,3*s,'#58b843');rounded(-23*s,-22*s,46*s,8*s,3*s,'#713a24');rounded(-21*s,-15*s,42*s,7*s,3*s,'#f7c44b');ellipse(0,-9*s,23*s,9*s,'#e4a24a');for(let k=0;k<5;k++)ellipse((k-2)*7*s,-33*s+(k%2)*3*s,2*s,1*s,'#fff0a0')}else{rounded(-26*s,-54*s,52*s,54*s,5*s,'#c94c45');rounded(-23*s,-50*s,46*s,7*s,2*s,'#ffcf58');ctx.fillStyle='white';ctx.font=`${12*s}px system-ui`;ctx.textAlign='center';ctx.fillText('LV '+it.need,0,-29*s)}ctx.restore()}
let px=project(0,lane).x,py=H*.87-jump*H*.13,level=Math.min(9,1+Math.floor(burgers/2)),scale=1+Math.min(1.2,(level-1)*.13);ctx.save();ctx.translate(px,py);ellipse(0,12,31*scale,9*scale,'#1c243955');ctx.scale(scale,scale);const bob=Math.sin(t/100)*2;ctx.translate(0,bob);ctx.strokeStyle='#253348';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-9,-22);ctx.lineTo(-12,-2);ctx.moveTo(9,-22);ctx.lineTo(12,-2);ctx.stroke();ellipse(0,-41,15+level*2.4,22,'#ffb62d');ctx.strokeStyle='#e89a72';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-14-level*1.6,-48);ctx.lineTo(-23-level*1.6,-28);ctx.moveTo(14+level*1.6,-48);ctx.lineTo(23+level*1.6,-28);ctx.stroke();ellipse(0,-77,17,19,'#f1b38c');ellipse(-6,-79,2,2,'#202b3e');ellipse(6,-79,2,2,'#202b3e');ctx.strokeStyle='#a34f41';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-75,6,0,Math.PI);ctx.stroke();ellipse(0,-94,17,7,'#513324');ctx.restore();if(shake>1){ctx.fillStyle=`rgba(255,240,100,${Math.min(.2,shake/100)})`;ctx.fillRect(0,0,W,H)}let pct=dist/FINISH;rounded(W*.15,H*.965,W*.7,8,4,'#26354b');rounded(W*.15,H*.965,W*.7*pct,8,4,'#ffba25')}
// Static opening screen background
spawnAt=15;try{draw(0)}catch(e){document.getElementById("message").textContent="Open deze game in Safari om te spelen.";}
</script></body></html>
